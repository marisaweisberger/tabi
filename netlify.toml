# Netlify build settings — picked up automatically once this repo is linked
# to the site (Site configuration → Build & deploy → Link repository).
#
# The build typechecks and bundles the React app with Vite into dist/.
# A TypeScript error fails the build, so broken code never deploys.
#
# The trip content is NOT part of any deploy: it lives in Netlify Blobs and
# is served by netlify/functions/trip-data.mts, so deploys can never clobber
# it and it never touches this public repo. The whole site sits behind
# netlify/edge-functions/gate.ts, which checks the TRIP_PASSWORD environment
# variable (set it in Site configuration → Environment variables). Both are
# auto-detected from the netlify/ folder — no config needed here.

[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
